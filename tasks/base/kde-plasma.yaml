- name: Install KDE Plasma Desktop
  ansible.builtin.dnf:
    name:
      - "@kde-desktop-environment"
      - qt6-qtlocation
      - angelfish
      - kcalc
      - kolourpaint
      - okular
      - krdp
    state: present

- name: Disable Plasma Discover KNS Backend
  ansible.builtin.file:
    path: /usr/lib64/qt6/plugins/discover/kns-backend.so
    state: absent

- name: Install KDE Games
  ansible.builtin.dnf:
    name:
      - kmines
      - ksnakeduel
      - ksudoku
      - kreversi
    state: present

- name: Install Kvantum
  ansible.builtin.dnf:
    name:
      - https://dl.fedoraproject.org/pub/fedora/linux/releases/44/Everything/x86_64/os/Packages/k/kvantum-1.1.6-1.fc44.x86_64.rpm
      - https://dl.fedoraproject.org/pub/fedora/linux/releases/44/Everything/x86_64/os/Packages/k/kvantum-data-1.1.6-1.fc44.noarch.rpm
    state: present
    disable_gpg_check: true

- name: Remove Unwanted KDE Apps
  ansible.builtin.dnf:
    name:
      - krfb

- name: Enable Plasma Login Manager
  ansible.builtin.file:
    src: /usr/lib/systemd/system/plasmalogin.service
    dest: /etc/systemd/system/display-manager.service
    state: link

- name: Disable Cockpit
  ansible.builtin.systemd_service:
    name: cockpit.socket
    enabled: false

